[project]
name = "rbx-prep"
version = "0.1.0"
description = "Set-prep helper for rbxport: grid tightening, stems, vocal-aware cues, extended intros"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
dependencies = [
  "numpy",
  "scipy",
  "librosa",
  "soundfile",
  "pyrekordbox",
  "demucs",
]

[project.scripts]
rbx-prep = "prep.cli:main"

[tool.uv]
# Lock for Apple Silicon (and Linux, for CI) only. A universal lock also has
# to cover Intel Macs, whose newest PyTorch is 2.2.2, and uv then pins that
# old version everywhere: it has no Python 3.13 build and fails to install.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prep"]
